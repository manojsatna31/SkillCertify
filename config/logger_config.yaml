default:
  log_dir: "logs"  # Directory where all log files will be stored
  log_format: "%(asctime)s - %(levelname)s - %(name)s - [%(module)s.%(funcName)s] - %(message)s"  # The format of log messages
  max_file_size_mb: 5   # File rotation will happen after the log file exceeds 5MB
  backup_count: 3       # Keep up to 3 rotated backup log files

environments:
  DEV:
    console_level: DEBUG    # Console handler will print DEBUG and higher level logs
    file_level: DEBUG       # File handler will write DEBUG and higher level logs
    enable_console: true    # Enable console logs for DEV

  UAT:
    console_level: INFO     # Console handler will print INFO and higher level logs
    file_level: INFO        # File handler will write INFO and higher level logs
    enable_console: true    # Enable console logs for UAT

  PROD:
    console_level: WARNING  # Console log level, but will not be used since enable_console is false
    file_level: WARNING     # File handler will write WARNING and higher level logs
    enable_console: false   # Disable console logs in production environment
