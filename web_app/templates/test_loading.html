<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTMX Loading Indicator Test</title>
    <!-- HTMX Library -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Tailwind CSS (optional, for styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* HTMX Indicator Styles */
        .htmx-indicator {
            opacity: 0;
            display: none;
            transition: opacity 500ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
            display: flex;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
            display: flex;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-8">
    <div class="max-w-2xl w-full bg-white rounded-lg shadow-lg p-6">
        <h1 class="text-2xl font-bold mb-6 text-center">HTMX Loading Indicator Test</h1>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="htmx-indicator flex justify-center items-center my-4">
            <div class="text-center">
                <svg aria-hidden="true" class="w-12 h-12 text-gray-200 animate-spin dark:text-gray-600 fill-blue-600 mx-auto" viewBox="0 0 100 101" fill="none">
                    <path d="M100 50.5908C100 78.2051 77.6142 100.591 50 100.591C22.3858 100.591 0 78.2051 0 50.5908C0 22.9766 22.3858 0.59082 50 0.59082C77.6142 0.59082 100 22.9766 100 50.5908ZM9.08144 50.5908C9.08144 73.1895 27.4013 91.5094 50 91.5094C72.5987 91.5094 90.9186 73.1895 90.9186 50.5908C90.9186 27.9921 72.5987 9.67226 50 9.67226C27.4013 9.67226 9.08144 27.9921 9.08144 50.5908Z" fill="currentColor"/>
                    <path d="M93.9676 39.0409C96.393 38.4038 97.8624 35.9116 97.0079 33.5539C95.2932 28.8227 92.871 24.3692 89.8167 20.348C85.8452 15.1192 80.8826 10.7238 75.2124 7.41289C69.5422 4.10194 63.2754 1.94025 56.7698 1.05124C51.7666 0.367541 46.6976 0.446843 41.7345 1.27873C39.2613 1.69328 37.813 4.19778 38.4501 6.62326C39.0873 9.04874 41.5694 10.4717 44.0505 10.1071C47.8511 9.54855 51.7191 9.52689 55.5402 10.0491C60.8642 10.7766 65.9928 12.5457 70.6331 15.2552C75.2735 17.9648 79.3347 21.5619 82.5849 25.841C84.9175 28.9121 86.7997 32.2913 88.1811 35.8758C89.083 38.2158 91.5421 39.6781 93.9676 39.0409Z" fill="currentFill"/>
                </svg>
                <p class="mt-2 text-gray-700">Loading content...</p>
            </div>
        </div>

        <!-- Content Area -->
        <div id="content-area"
             hx-get="/simulate-loading"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#loading-indicator"
             class="border border-dashed border-gray-300 rounded-lg p-4 min-h-[200px] flex items-center justify-center text-gray-500">
            Content will load here in 3 seconds...
        </div>

        <!-- Test Controls -->
        <div class="mt-6 flex justify-center space-x-4">
            <button
                hx-get="/simulate-loading"
                hx-target="#content-area"
                hx-indicator="#loading-indicator"
                class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition">
                Reload Content
            </button>

            <button
                hx-get="/simulate-slow-loading"
                hx-target="#content-area"
                hx-indicator="#loading-indicator"
                class="px-4 py-2 bg-green-500 text-white rounded hover:bg-green-600 transition">
                Slow Load (5s)
            </button>
        </div>

        <div class="mt-4 text-sm text-gray-600 text-center">
            <p>Click the buttons to test the loading indicator with different response times.</p>
        </div>
    </div>

</body>
</html>
