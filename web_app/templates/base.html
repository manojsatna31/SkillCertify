<!-- ================= admin-base.html ================= -->
<!-- This is the base template containing shared structure, styles, and scripts -->
<!DOCTYPE html>
<html lang="en" class="h-full">
<!--<html lang="en" class="antialiased">-->
<head>
<!--    <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>-->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="SkillCertify is a platform to discover, learn, and certify your skills in various technologies.">
    <meta name="keywords" content="SkillCertify, certification, skills, technology, exams, learning, platform">
    <title>SkillCertify</title>

    <!-- Tailwind CSS -->
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <!--    <script src="https://kit.fontawesome.com/a076d05399.js">-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- HTMX Library -->
    <script src="https://unpkg.com/htmx.org@2.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Theme Initialization Script -->
    <script>
        // Set initial theme based on user preference
        if (localStorage.getItem('theme') === 'dark' ||
            (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <!-- Theme Toggle Styles -->
    <style>
        #theme-toggle .fa-sun { display: none; }
        .dark #theme-toggle .fa-sun { display: inline-block; }
        .dark #theme-toggle .fa-moon { display: none; }
    </style>
    <style>
    .htmx-indicator {
        opacity: 0;
        display: none;
        transition: opacity 500ms ease-in;
    }
    .htmx-request .htmx-indicator {
        opacity: 1;
        display: flex;
    }
    .htmx-request.htmx-indicator {
        opacity: 1;
        display: flex;
    }
</style>

    <style>
        //New
        /* Small bespoke styles for the logo animation */
        .badge-hover:hover { transform: translateY(-4px) scale(1.03); }
        .badge-hover { transition: transform 280ms cubic-bezier(.2,.9,.3,1); }

        .check-animate { transform-origin: 70% 70%; transition: transform 320ms ease; }
        .badge-hover:hover .check-animate { transform: scale(1.05) rotate(-6deg); }

        /* subtle sparkle animation */
        @keyframes twinkle { 0% { opacity: 0.2; transform: translateY(0);} 50% { opacity: 1; transform: translateY(-3px);} 100% { opacity: 0.2; transform: translateY(0);} }
        .sparkle { animation: twinkle 2.8s infinite ease-in-out; }

        /* accessible focus outline for keyboard users */
        .focus-ring:focus { outline: 3px solid rgba(99,102,241,0.18); outline-offset: 4px; border-radius: 0.5rem; }
        //Old
        .option-border {
            border-width: 3px !important;
            border-style: solid !important;
        }
        .dark .border-green-500 {
            border-color: #10b981 !important;
        }
        .dark .border-red-500 {
            border-color: #ef4444 !important;
        }
            .nav-dot {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .nav-dot:hover {
            transform: scale(1.1);
        }
        .nav-dot.correct {
            background-color: #10b981;
            color: white;
        }
        .nav-dot.incorrect {
            background-color: #ef4444;
            color: white;
        }
        .nav-dot.unanswered {
            background-color: #9ca3af;
            color: white;
        }
        .nav-dot.active {
          background-color: #2563eb; /* blue-600 */
          color: white;
          font-weight: 600;
        }
            .progress-bar {
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            border-radius: 4px;
        }
    </style>
    <style>
        /* HTMX Indicator Styles */
        .htmx-indicator {
            opacity: 0;
            display: none;
            transition: opacity 500ms ease-in;
        }
        .htmx-request .htmx-indicator {
            opacity: 1;
            display: flex;
        }
        .htmx-request.htmx-indicator {
            opacity: 1;
            display: flex;
        }

        /* Content area transitions */
        #content-area {
            transition: opacity 0.3s ease-in-out;
        }

        /* Ensure content container has proper positioning */
        #content-container {
            position: relative;
        }

        /* Loading indicator styles */
        .htmx-indicator {
            opacity: 0;
            display: none;
            transition: opacity 0.3s ease-in-out;
        }

        .htmx-request .htmx-indicator {
            opacity: 1;
            display: flex;
        }

        .htmx-request.htmx-indicator {
            opacity: 1;
            display: flex;
        }



    </style>
</head>
<body class="flex flex-col min-h-screen w-full max-w-none bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-200 transition-colors duration-300">
<!--<body class="flex flex-col min-h-screen">-->

<!-- Header: left group pinned to far left, toggle pinned to far right -->
<header class="sticky top-0 z-40 bg-white dark:bg-gray-800 shadow-md">
    <div class="w-full flex items-center justify-between px-6 py-3">
        <!-- Left: Logo + Brand text (no centering container, no side padding) -->
        <div class="flex items-center gap-3">
            <div class="badge-hover focus-ring rounded-lg p-0.5 bg-gradient-to-br from-indigo-50 to-cyan-50 dark:from-transparent dark:to-transparent">
                <svg class="w-12 h-12 block" viewBox="0 0 120 120" role="img"
                     aria-label="SkillCertify logo — badge with monogram and check">
                    <defs>
                        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#7c3aed"/>
                            <stop offset="0.6" stop-color="#4f46e5"/>
                            <stop offset="1" stop-color="#06b6d4"/>
                        </linearGradient>
                        <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.12"/>
                        </filter>
                    </defs>

                    <g filter="url(#drop)">
                        <circle cx="60" cy="60" r="46" fill="url(#g1)"/>
                        <circle cx="60" cy="60" r="36" fill="rgba(255,255,255,0.06)"/>
                    </g>

                    <g transform="translate(0,4)">
                        <text x="50%" y="54%" text-anchor="middle"
                              font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial"
                              font-weight="800" font-size="44" fill="white" style="letter-spacing:-2px">SC
                        </text>
                    </g>

                    <g class="check-animate" transform="translate(18,18)">
                        <path d="M34 44c6-6 16-18 26-26" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="8"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M20 44l12 10 36-40" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"
                              stroke-linejoin="round"/>
                    </g>

                    <g fill="white" opacity="0.9">
                        <circle class="sparkle" cx="92" cy="28" r="2.2" opacity="0.9"/>
                        <circle cx="30" cy="18" r="1.6" opacity="0.85"/>
                        <circle cx="18" cy="76" r="1.6" opacity="0.85"/>
                    </g>
                </svg>
            </div>

            <!-- Brand text -->
            <div>
                <a href="/"
                   class="text-2xl font-extrabold text-gray-800 dark:text-white tracking-tight">SkillCertify</a>
                <div class="text-md text-gray-800 dark:text-white">Skills • Validation • Growth</div>
            </div>
        </div>

        <!-- Right: Theme toggle -->
        <div class="flex items-center gap-3">
            <button id="theme-toggle"
                    class="relative inline-flex h-6 w-11 items-center rounded-full bg-gray-300 dark:bg-gray-600 transition-colors duration-300">
          <span class="translate-x-1 dark:translate-x-6 inline-block h-4 w-4 transform rounded-full bg-white transition-transform duration-300">
            <i class="fas fa-sun text-yellow-400 dark:hidden block text-xs absolute top-1 left-0.5"></i>
            <i class="fas fa-moon text-blue-300 hidden dark:block text-xs absolute top-1 left-0.5"></i>
          </span>
            </button>
        </div>
    </div>
</header>


<!-- Content Block (to be filled by child templates) -->
<div class="w-full max-w-none bg-slate-50 dark:bg-slate-900 mx-auto px-4 py-1">
    <!--<div class="flex-grow bg-slate-50 dark:bg-slate-900">-->
    {% block content %}{% endblock %}
</div>





<!-- Footer -->
<footer class="sticky bottom-0 w-full bg-white dark:bg-gray-800 shadow-md">
    <div class="w-full flex items-center justify-between py-3 px-4">
        <!-- Left: Copyright -->
        <div class="flex-none">
            <p class="font-semibold text-sm text-gray-800 dark:text-white">© 2024 SkillCertify Platform. All rights reserved.</p>
        </div>

        <!-- Center: Future expandable content -->
        <div class="flex-1 text-center">
            <!-- Empty for now; future content goes here -->
        </div>

        <!-- Right: Social Icons -->
        <div class="flex-none flex space-x-6">
            <a class="text-gray-800 dark:text-white hover:text-blue-600" href="https://linkedin.com/in/reachmm"
               target="_blank" title="LinkedIn">
                <i class="fab fa-linkedin-in fa-lg"></i>
            </a>
            <a class="text-gray-800 dark:text-white hover:text-gray-900" href="https://github.com/manojsatna31"
               target="_blank" title="GitHub">
                <i class="fab fa-github fa-lg"></i>
            </a>
            <a class="text-gray-800 dark:text-white hover:text-black" href="https://medium.com/@manoj.satna31"
               target="_blank" title="Medium">
                <i class="fab fa-medium fa-lg"></i>
            </a>
            <a class="text-gray-800 dark:text-white hover:text-gray-800" href="https://dev.to/manojsatna31"
               target="_blank" title="Dev.to">
                <i class="fab fa-dev fa-lg"></i>
            </a>
            <a class="text-gray-800 dark:text-white hover:text-green-600" href="https://manojsatna31.github.io/"
               target="_blank" title="Portfolio">
                <i class="fas fa-globe fa-lg"></i>
            </a>
        </div>
    </div>
</footer>


<!-- Main JavaScript -->
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
