
  <style>
    .icon-picker {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
      gap: 10px;
      max-height: 300px;
      overflow-y: auto;
    }
    .icon-option {
      cursor: pointer;
      text-align: center;
      padding: 8px;
      border: 1px solid transparent;
      border-radius: 6px;
    }
    .icon-option:hover {
      border-color: #3b82f6;
      background-color: #e0f2fe;
    }
    .save-btn {
      transition: all 0.3s ease;
    }
    .save-btn.saving {
      opacity: 0.7;
      cursor: not-allowed;
    }
  </style>

    <div id="technologies" class="tab-content active fade-in">
    <h1 class="text-3xl font-bold mb-6 text-center">⚙️ Manage Technologies</h1>

    <!-- Table -->
    <div class="overflow-x-auto shadow-lg border rounded-lg">
      <table class="min-w-full border-collapse divide-y divide-gray-200 dark:divide-gray-700">
        <thead class="bg-gray-200 dark:bg-gray-800">
          <tr>
            <th class="px-4 py-2 text-left">S.No</th>
            <th class="px-4 py-2 text-left">ID</th>
            <th class="px-4 py-2 text-left">Name</th>
            <th class="px-4 py-2 text-left">Icon</th>
            <th class="px-4 py-2 text-left">Datafile</th>
            <th class="px-4 py-2 text-left">Description</th>
            <th class="px-4 py-2 text-center">Active</th>
            <th class="px-4 py-2 text-center">Save</th>
            <th class="px-4 py-2 text-center">Actions</th>
          </tr>
        </thead>
        <tbody id="tech-table" class="divide-y divide-gray-200 dark:divide-gray-700">
          {% for tech in technologies %}
          <tr class="hover:bg-gray-100 dark:hover:bg-gray-800" data-index="{{ loop.index0 }}">
            <td class="px-4 py-2 text-center">{{ loop.index }}</td>
            <td class="px-4 py-2"><input value="{{ tech.id }}" class="w-full border rounded p-1" onchange="updateField({{ loop.index0 }}, 'id', this.value)"></td>
            <td class="px-4 py-2"><input value="{{ tech.name|join(', ') }}" class="w-full border rounded p-1" onchange="updateArray({{ loop.index0 }}, 'name', this.value)"></td>
            <td class="px-4 py-2 text-center">
              <i class="{{ tech.icon[0] }} text-xl"></i>
              <button class="ml-2 text-blue-600 hover:underline" onclick="openIconModal({{ loop.index0 }})">Change</button>
            </td>
            <td class="px-4 py-2"><input value="{{ tech.datafile or '' }}" class="w-full border rounded p-1" onchange="updateField({{ loop.index0 }}, 'datafile', this.value)"></td>
            <td class="px-4 py-2"><textarea rows="2" class="w-full border rounded p-1" onchange="updateField({{ loop.index0 }}, 'description', this.value)">{{ tech.description }}</textarea></td>
            <td class="px-4 py-2 text-center">
              <input type="checkbox" {{ 'checked' if tech.active else '' }} onchange="updateField({{ loop.index0 }}, 'active', this.checked)">
            </td>
            <td class="px-4 py-2 text-center">
              <button onclick="saveSingleTechnology({{ loop.index0 }})" class="save-btn px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">💾 Save</button>
            </td>
            <td class="px-4 py-2 text-center">
              <button class="text-red-600 hover:underline" onclick="deleteRow({{ loop.index0 }})">🗑️ Delete</button>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

    <!-- Action Buttons -->
    <div class="mt-6 flex justify-center space-x-4">
      <button onclick="addRow()" class="px-5 py-2 bg-green-600 text-white rounded-lg shadow hover:bg-green-700">➕ Add Technology</button>
      <button onclick="saveAllTechnologies()" class="px-5 py-2 bg-purple-600 text-white rounded-lg shadow hover:bg-purple-700">💾 Save All Technologies</button>
    </div>

    <!-- Validation Result -->
    <div id="validation-result" class="mt-6 p-4 border rounded bg-gray-50 dark:bg-gray-700 text-sm whitespace-pre-wrap"></div>

    <!-- Icon Picker Modal -->
    <div id="icon-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-11/12 max-w-3xl">
        <h2 class="text-lg font-bold mb-4">Select an Icon</h2>
        <input type="text" id="icon-search" placeholder="Search icons..." class="w-full mb-4 p-2 border rounded">
        <div class="icon-picker" id="icon-picker"></div>
        <div class="mt-4 text-right">
          <button onclick="closeIconModal()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Close</button>
        </div>
      </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmation-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white dark:bg-gray-800 rounded-lg p-6 w-11/12 max-w-md">
        <h2 class="text-lg font-bold mb-4" id="confirmation-title">Confirm Action</h2>
        <p id="confirmation-message" class="mb-6">Are you sure you want to perform this action?</p>
        <div class="flex justify-end space-x-3">
          <button onclick="closeConfirmationModal()" class="px-4 py-2 bg-gray-500 text-white rounded hover:bg-gray-600">Cancel</button>
          <button onclick="confirmAction()" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700" id="confirm-button">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script>

    let technologies = {{ technologies | tojson }};

    let pendingAction = null;
    let currentIconIndex = null;

    // FontAwesome icons for the icon picker
    const fontawesomeIcons = [
      "fas fa-calculator text-blue-500","fab fa-aws text-orange-500","fas fa-mug-hot text-orange-600","fab fa-react text-blue-500","fab fa-angular text-red-600","fab fa-python text-blue-500","fab fa-html5 text-orange-500","fab fa-css3-alt text-blue-500","fas fa-database text-blue-500","fab fa-js-square text-yellow-500","fab fa-vuejs text-green-500","fab fa-node-js text-green-600","fas fa-code text-indigo-500","fas fa-feather-alt text-blue-400","fab fa-docker text-blue-500","fas fa-network-wired text-blue-600","fas fa-cloud text-blue-500","fas fa-cogs text-orange-500","fab fa-git-alt text-orange-600","fab fa-github text-black","fab fa-gitlab text-orange-600","fas fa-mouse-pointer text-green-500","fas fa-vial text-green-600","fas fa-flask text-yellow-500","fas fa-grin-stars text-pink-500","fas fa-bug text-red-500","fas fa-shield-alt text-gray-700","fas fa-server text-purple-600","fas fa-lock text-gray-800","fas fa-laptop-code text-indigo-600","fas fa-terminal text-gray-600","fas fa-keyboard text-teal-600","fas fa-sitemap text-blue-700","fas fa-sync text-orange-700","fas fa-robot text-green-700","fas fa-brain text-purple-700","fas fa-microchip text-gray-700","fas fa-cube text-indigo-700","fas fa-layer-group text-blue-600","fas fa-mobile-alt text-pink-600","fas fa-tablet-alt text-gray-600","fas fa-desktop text-green-600","fas fa-gamepad text-red-600","fas fa-headphones text-blue-600","fas fa-music text-purple-600","fas fa-photo-video text-indigo-600","fas fa-camera text-pink-600","fas fa-video text-green-600","fas fa-film text-red-600","fas fa-book text-indigo-600","fas fa-book-open text-blue-600","fas fa-lightbulb text-yellow-500","fas fa-graduation-cap text-green-600","fas fa-chalkboard-teacher text-orange-600","fas fa-user-graduate text-indigo-600","fas fa-users text-blue-600","fas fa-user-friends text-teal-600","fas fa-user-cog text-purple-600","fas fa-id-card text-gray-600","fas fa-briefcase text-pink-600","fas fa-business-time text-orange-600","fas fa-balance-scale text-green-600","fas fa-gavel text-red-600","fas fa-handshake text-indigo-600","fas fa-comments text-blue-600","fas fa-envelope text-orange-600","fas fa-paper-plane text-green-600","fas fa-bell text-yellow-600","fas fa-clock text-purple-600","fas fa-calendar text-indigo-600","fas fa-map-marker-alt text-red-600","fas fa-globe text-blue-600","fas fa-compass text-teal-600","fas fa-route text-orange-600","fas fa-road text-gray-600","fas fa-car text-green-600","fas fa-bus text-blue-600","fas fa-train text-indigo-600","fas fa-plane text-purple-600","fas fa-ship text-pink-600","fas fa-rocket text-orange-600","fas fa-hotel text-blue-600","fas fa-utensils text-red-600","fas fa-pizza-slice text-yellow-600","fas fa-coffee text-brown-600","fas fa-ice-cream text-pink-600","fas fa-beer text-yellow-600","fas fa-birthday-cake text-purple-600","fas fa-apple-alt text-green-600","fas fa-lemon text-yellow-500","fas fa-seedling text-green-500","fas fa-leaf text-green-600","fas fa-tree text-green-700","fas fa-mountain text-gray-600","fas fa-water text-blue-600","fas fa-fire text-red-600","fas fa-sun text-yellow-500","fas fa-moon text-indigo-600","fas fa-star text-yellow-400","fas fa-heart text-red-600","fas fa-thumbs-up text-blue-600","fas fa-thumbs-down text-gray-600"
    ];

    // Initialize the table when the page loads
    document.addEventListener('DOMContentLoaded', function() {
      renderTable();

      // Set up the icon search functionality
      const iconSearch = document.getElementById("icon-search");
      if (iconSearch) {
        iconSearch.addEventListener("input", (e) => {
          populateIcons(e.target.value.trim());
        });
      }
    });

    function renderTable() {
      const tbody = document.getElementById("tech-table");
      tbody.innerHTML = "";

      technologies.forEach((tech, index) => {
        const row = `
          <tr class="hover:bg-gray-100" data-index="${index}">
            <td class="px-4 py-2 text-center">${index + 1}</td>
            <td class="px-4 py-2"><input value="${tech.id}" class="w-full border rounded p-1" onchange="updateField(${index}, 'id', this.value)"></td>
            <td class="px-4 py-2"><input value="${tech.name.join(', ')}" class="w-full border rounded p-1" onchange="updateArray(${index}, 'name', this.value)"></td>
            <td class="px-4 py-2 text-center">
              <i class="${tech.icon[0]} text-xl"></i>
              <button class="ml-2 text-blue-600 hover:underline" onclick="openIconModal(${index})">Change</button>
            </td>
            <td class="px-4 py-2"><input value="${tech.datafile || ''}" class="w-full border rounded p-1" onchange="updateField(${index}, 'datafile', this.value)"></td>
            <td class="px-4 py-2"><textarea rows="2" class="w-full border rounded p-1" onchange="updateField(${index}, 'description', this.value)">${tech.description}</textarea></td>
            <td class="px-4 py-2 text-center">
              <input type="checkbox" ${tech.active ? 'checked' : ''} onchange="updateField(${index}, 'active', this.checked)">
            </td>
            <td class="px-4 py-2 text-center">
              <button onclick="saveSingleTechnology(${index})" class="save-btn px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600">💾 Save</button>
            </td>
            <td class="px-4 py-2 text-center">
              <button class="text-red-600 hover:underline" onclick="deleteRow(${index})">🗑️ Delete</button>
            </td>
          </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
    }

    function updateField(index, field, value) {
      technologies[index][field] = value;
    }

    function updateArray(index, field, value) {
      technologies[index][field] = value.split(",").map(v => v.trim()).filter(Boolean);
    }

    function addRow() {
      technologies.push({
        id: "",
        name: [""],
        icon: ["fas fa-question text-gray-400"],
        datafile: "",
        description: "",
        active: false
      });
      renderTable();
    }

    function deleteRow(index) {
      showConfirmation(
        "Delete Technology",
        `Are you sure you want to delete the technology "${technologies[index].id}"?`,
        () => {
          technologies.splice(index, 1);
          renderTable();
          showValidationResult("✅ Technology deleted successfully!", "success");
        }
      );
    }

    function validateTechnology(tech, index) {
      if (!tech.id) {
        throw new Error(`Row ${index + 1}: Missing ID`);
      }

      if (!tech.name.length || !tech.name[0]) {
        throw new Error(`Row ${index + 1}: Name is required`);
      }

      // Only require datafile and description if technology is active
      if (tech.active) {
        if (!tech.datafile) {
          throw new Error(`Row ${index + 1}: Datafile is required for active technologies`);
        }
        if (!tech.description) {
          throw new Error(`Row ${index + 1}: Description is required for active technologies`);
        }
      }

      return true;
    }

    function saveSingleTechnology(index) {
      const tech = technologies[index];

      try {
        validateTechnology(tech, index);

        showConfirmation(
          "Save Technology",
          `Are you sure you want to save the technology "${tech.id}"?`,
          () => {
            // Add saving class to button
            const saveBtn = document.querySelector(`tr[data-index="${index}"] .save-btn`);
            saveBtn.classList.add('saving');
            saveBtn.innerHTML = '⏳ Saving...';

            // Simulate API call
            setTimeout(() => {
              showValidationResult("✅ Technology saved successfully!", "success");
              saveBtn.classList.remove('saving');
              saveBtn.innerHTML = '💾 Save';
            }, 1000);
          }
        );
      } catch (err) {
        showValidationResult("❌ Validation Error: " + err.message, "error");
      }
    }

    function saveAllTechnologies() {
      try {
        technologies.forEach((tech, i) => {
          validateTechnology(tech, i);
        });

        const datafiles = technologies.filter(t => t.active).map(t => t.datafile);
        const duplicates = datafiles.filter((df, i) => datafiles.indexOf(df) !== i);
        if (duplicates.length) {
          throw new Error(`Duplicate datafile(s) for active technologies: ${[...new Set(duplicates)].join(', ')}`);
        }

        showConfirmation(
          "Save All Technologies",
          `Are you sure you want to save all ${technologies.length} technologies?`,
          () => {
            // Simulate API call
            setTimeout(() => {
              showValidationResult("✅ All technologies saved successfully!", "success");
            }, 1000);
          }
        );
      } catch (err) {
        showValidationResult("❌ Validation Error: " + err.message, "error");
      }
    }

    function showValidationResult(message, type = "info") {
      const resultDiv = document.getElementById("validation-result");
      resultDiv.innerText = message;

      // Set appropriate background color based on message type
      if (type === "success") {
        resultDiv.classList.add("bg-green-100", "text-green-800");
        resultDiv.classList.remove("bg-red-100", "text-red-800", "bg-gray-50");
      } else if (type === "error") {
        resultDiv.classList.add("bg-red-100", "text-red-800");
        resultDiv.classList.remove("bg-green-100", "text-green-800", "bg-gray-50");
      } else {
        resultDiv.classList.add("bg-gray-50");
        resultDiv.classList.remove("bg-green-100", "text-green-800", "bg-red-100", "text-red-800");
      }
    }

    // Icon picker logic
    function openIconModal(index) {
      currentIconIndex = index;
      populateIcons();
      document.getElementById("icon-modal").classList.remove("hidden");
    }

    function populateIcons(filter = "") {
      const picker = document.getElementById("icon-picker");
      picker.innerHTML = "";
      fontawesomeIcons.filter(icon => icon.includes(filter)).forEach(icon => {
        picker.innerHTML += `<div class='icon-option' onclick="selectIcon('${icon}')"><i class="${icon} text-xl"></i></div>`;
      });
    }

    function selectIcon(icon) {
      if (currentIconIndex !== null) {
        technologies[currentIconIndex].icon = [icon];
        renderTable();
      }
      closeIconModal();
    }

    function closeIconModal() {
      document.getElementById("icon-modal").classList.add("hidden");
    }

    // Confirmation modal functions
    function showConfirmation(title, message, callback) {
      document.getElementById("confirmation-title").innerText = title;
      document.getElementById("confirmation-message").innerText = message;
      document.getElementById("confirmation-modal").classList.remove("hidden");
      pendingAction = callback;
    }

    function closeConfirmationModal() {
      document.getElementById("confirmation-modal").classList.add("hidden");
      pendingAction = null;
    }

    function confirmAction() {
      if (pendingAction) {
        pendingAction();
      }
      closeConfirmationModal();
    }
  </script>
