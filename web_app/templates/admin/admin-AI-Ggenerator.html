<div id="ai-generator" class="tab-content active fade-in">
    <div class="bg-white rounded-lg shadow p-6 mb-6">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">AI Question Generator</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Input Section -->
            <div class="bg-gray-50 p-6 rounded-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Generate Questions</h3>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Technology</label>
                    <select class="w-full border border-gray-300 rounded-lg px-4 py-2 form-input" id="ai-technology">
                        <option value="">Select Technology</option>
                        {% for tech in technologies %}
                        <option value="{{ tech.id }}">{{ tech.name[0] if tech.name else 'Unnamed' }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Exam Set</label>
                    <select class="w-full border border-gray-300 rounded-lg px-4 py-2 form-input" id="ai-exam-set">
                        <option value="">Select Exam Set (optional)</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Prompt</label>
                    <textarea class="w-full border border-gray-300 rounded-lg px-4 py-2 form-input h-32" id="ai-prompt" placeholder="Example: Generate 5 questions about AWS S3 with medium difficulty"></textarea>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Number of Questions</label>
                    <input type="number" id="ai-question-count" min="1" max="20" value="5" class="w-full border border-gray-300 rounded-lg px-4 py-2 form-input">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">Difficulty</label>
                    <select class="w-full border border-gray-300 rounded-lg px-4 py-2 form-input" id="ai-difficulty">
                        <option value="Easy">Easy</option>
                        <option value="Medium" selected>Medium</option>
                        <option value="Hard">Hard</option>
                    </select>
                </div>
                <button class="w-full btn btn-primary" onclick="generateQuestions()">
                    <i class="fas fa-robot mr-2"></i> Generate Questions
                </button>
            </div>

            <!-- Output Section -->
            <div class="bg-gray-50 p-6 rounded-lg">
                <h3 class="text-lg font-semibold text-gray-800 mb-4">Generated Questions</h3>
                <div class="json-view mb-4" id="ai-output">
                    <pre>{
  "status": "ready",
  "message": "Enter a prompt and click 'Generate Questions'"
}</pre>
                </div>
                <div class="flex space-x-2">
                    <button class="flex-1 btn" id="copy-json-btn" disabled onclick="copyToClipboard()">
                        <i class="fas fa-copy mr-2"></i> Copy JSON
                    </button>
                    <button class="flex-1 btn btn-success" id="save-json-btn" disabled onclick="saveGeneratedQuestions()">
                        <i class="fas fa-save mr-2"></i> Save to Exam Set
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// Load exam sets when technology is selected
document.getElementById('ai-technology').addEventListener('change', function() {
    const techId = this.value;
    const examSetSelect = document.getElementById('ai-exam-set');

    if (!techId) {
        examSetSelect.innerHTML = '<option value="">Select Exam Set (optional)</option>';
        return;
    }

    fetch(`/admin/api/exam-sets?tech_id=${techId}`)
        .then(response => response.json())
        .then(examSets => {
            examSetSelect.innerHTML = '<option value="">Select Exam Set (optional)</option>';

            examSets.forEach(examSet => {
                const option = document.createElement('option');
                option.value = examSet.id;
                option.textContent = examSet.name;
                examSetSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error('Error loading exam sets:', error);
        });
});
</script>
