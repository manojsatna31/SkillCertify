{% extends "base.html" %}

{% block content %}
<!-- Admin Navigation Tabs -->
<div class="bg-white shadow-sm">
    <div class="container mx-auto px-4">
        <div class="flex space-x-2">
            <div class="nav-tab {% if request.endpoint == 'admin.admin_dashboard' %}active{% endif %}"
                 hx-get="{{ url_for('admin.admin_dashboard') }}"
                 hx-target="#admin-content"
                 hx-push-url="true">
                <i class="fas fa-tachometer-alt mr-2"></i>Dashboard
            </div>
            <div class="nav-tab {% if request.endpoint == 'admin.admin_technologies' %}active{% endif %}"
                 hx-get="{{ url_for('admin.admin_technologies') }}"
                 hx-target="#admin-content"
                 hx-swap="innerHTML"
                 hx-push-url="true">
                <i class="fas fa-laptop-code mr-2"></i>Technologies
            </div>
            <div class="nav-tab {% if request.endpoint == 'admin.admin_exam_sets' %}active{% endif %}"
                 hx-get="{{ url_for('admin.admin_exam_sets') }}"
                 hx-target="#admin-content"
                 hx-swap="innerHTML"
                 hx-push-url="true">
                <i class="fas fa-file-alt mr-2"></i>Exam Sets
            </div>
            <div class="nav-tab {% if request.endpoint == 'admin.admin_questions' %}active{% endif %}"
                 hx-get="{{ url_for('admin.admin_questions') }}"
                 hx-target="#admin-content"
                 hx-swap="innerHTML"
                 hx-push-url="true">
                <i class="fas fa-question-circle mr-2"></i>Questions
            </div>
            <div class="nav-tab {% if request.endpoint == 'admin.admin_ai_generator' %}active{% endif %}"
                 hx-get="{{ url_for('admin.admin_ai_generator') }}"
                 hx-target="#admin-content"
                 hx-push-url="true">
                <i class="fas fa-robot mr-2"></i>AI Generator
            </div>
        </div>
    </div>
</div>

// API functions
async function deleteItem(type, id) {
    try {
        const response = await fetch(`/admin/api/${type}s?id=${id}`, {
            method: 'DELETE',
            headers: {
                'Content-Type': 'application/json',
            }
        });

        const result = await response.json();

        if (result.status === 'success') {
            showToast(`${type.charAt(0).toUpperCase() + type.slice(1)} deleted successfully!`, 'success');
            // Refresh the current view
            htmx.trigger(`#admin-${type}s`, 'refresh');
        } else {
            showToast(`Error deleting ${type}`, 'error');
        }
    } catch (error) {
        console.error(`Error deleting ${type}:`, error);
        showToast(`Error deleting ${type}`, 'error');
    }
}

async function generateQuestions() {
    const technology = document.getElementById('ai-technology').value;
    const examSet = document.getElementById('ai-exam-set').value;
    const prompt = document.getElementById('ai-prompt').value;
    const count = document.getElementById('ai-question-count').value;
    const difficulty = document.getElementById('ai-difficulty').value;

    // Show loading state
    const outputElement = document.getElementById('ai-output');
    outputElement.innerHTML = '<pre>{\n  "status": "processing",\n  "message": "Generating questions..."\n}</pre>';

    try {
        const response = await fetch('/admin/api/generate-questions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                technology,
                exam_set: examSet,
                prompt,
                count,
                difficulty
            })
        });

        const result = await response.json();

        // Format the JSON with syntax highlighting
        const formattedJson = JSON.stringify(result, null, 4);
        const highlightedJson = formattedJson
            .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?)/g, function(match) {
                let cls = 'json-string';
                if (/:$/.test(match)) {
                    cls = 'json-key';
                } else if (/true|false/.test(match)) {
                    cls = 'json-boolean';
                } else if (/[0-9]+/.test(match)) {
                    cls = 'json-number';
                }
                return '<span class="' + cls + '">' + match + '</span>';
            });

        outputElement.innerHTML = '<pre>' + highlightedJson + '</pre>';

        // Enable buttons
        document.getElementById('copy-json-btn').disabled = false;
        document.getElementById('save-json-btn').disabled = false;

        showToast('Questions generated successfully!', 'success');
    } catch (error) {
        console.error('Error generating questions:', error);
        outputElement.innerHTML = '<pre>{\n  "error": "Failed to generate questions"\n}</pre>';
        showToast('Failed to generate questions', 'error');
    }
}

function copyToClipboard() {
    const outputElement = document.getElementById('ai-output');
    const text = outputElement.textContent;

    navigator.clipboard.writeText(text).then(() => {
        showToast('JSON copied to clipboard!', 'success');
    }).catch(err => {
        showToast('Failed to copy JSON', 'error');
    });
}
